name: 'junit2md'
description: 'Creates a markdown file from junit files'
inputs:
  junit-directory:
    description: 'Directory with the junit files'
    required: true
runs:
  using: "composite"
  steps:
    - name: Fetch junit2md
      shell: bash
      env:
        JUNIT2MD_VERSION: v0.0.4
        JUNIT2MD_SHA256_AMD64: "db34c8d964c26e5b182dd639b861e9d97257a082b8db4e31a324a98a1901af70"
        JUNIT2MD_SHA256_ARM64: "91e87a9ad095fbf3469be2ec314c7d64760b778d73ffeb7d45dac27019308e87"
        RUNNER_ARCH: ${{ runner.arch }}
        RUNNER_OS: ${{ runner.os }}
      run: |
        if [ "${RUNNER_OS}" != Linux ]; then
          echo "::error::junit2md has release binaries for Linux only, not ${RUNNER_OS}"
          exit 1
        fi
        case "${RUNNER_ARCH}" in
          X64) arch=amd64 want="${JUNIT2MD_SHA256_AMD64}" ;;
          ARM64) arch=arm64 want="${JUNIT2MD_SHA256_ARM64}" ;;
          *) echo "::error::junit2md has no release binary for runner architecture ${RUNNER_ARCH}"; exit 1 ;;
        esac
        dir="${RUNNER_TEMP}/junit2md"
        bin="${dir}/junit2md"
        if [ -f "${bin}" ]; then
          if [ "$(sha256sum < "${bin}" | cut -d ' ' -f 1)" = "${want}" ]; then
            chmod 0755 "${bin}"
            echo "Using ${bin}, sha256 ${want}"
            exit 0
          fi
          rm -f "${bin}"
        fi
        mkdir -p "${dir}"
        url="https://github.com/aanm/junit2md/releases/download/${JUNIT2MD_VERSION}/junit2md-linux-${arch}"
        tmp="$(mktemp "${dir}/download.XXXXXX")"
        echo "Downloading ${url}"
        if ! curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
          --connect-timeout 10 --max-time 120 -o "${tmp}" "${url}"; then
          rm -f "${tmp}"
          echo "::error::Failed to download ${url}"
          exit 1
        fi
        have="$(sha256sum < "${tmp}" | cut -d ' ' -f 1)"
        if [ "${have}" != "${want}" ]; then
          rm -f "${tmp}"
          echo "::error::${url} has sha256 ${have}, expected ${want}"
          exit 1
        fi
        chmod 0755 "${tmp}"
        mv -f "${tmp}" "${bin}"

    - name: Publish Test Results As GitHub Summary
      # No -e, so that a file junit2md cannot parse does not stop the loop.
      shell: sh {0}
      env:
        JUNIT_DIRECTORY: ${{ inputs.junit-directory }}
        # Sort the glob by bytes under any runner locale.
        LC_ALL: C
      run: |
        JUNIT2MD="${RUNNER_TEMP}/junit2md/junit2md"
        [ -x "${JUNIT2MD}" ] || { echo "::error::${JUNIT2MD} is missing"; exit 1; }
        {
          for filename in "${JUNIT_DIRECTORY}"/*.xml; do
            echo ""
            "${JUNIT2MD}" -i "${filename}" -v=true -s=false -p=false
          done
          echo ""
          echo "## Summary of all tests"
          echo ""
          echo "<details>"
          echo "  <summary>Click here to see</summary>"
          for filename in "${JUNIT_DIRECTORY}"/*.xml; do
            echo ""
            echo "#### ${filename}"
            "${JUNIT2MD}" -i "${filename}" -s=false
          done
          echo "</details>"
        } >> "${GITHUB_STEP_SUMMARY}"
